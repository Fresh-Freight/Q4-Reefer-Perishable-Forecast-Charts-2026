name: Build Q4 Forecast Charts

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ─────────────────────────────────────────────────────────────
      # usda-commodity-heatmap  (USDA AMS Socrata — public data)
      # ─────────────────────────────────────────────────────────────
      - name: Install deps — usda-commodity-heatmap
        run: pip install -r charts/usda-commodity-heatmap/requirements.txt

      - name: Fetch data — usda-commodity-heatmap
        # SOCRATA_APP_TOKEN is optional; the dataset is public.
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python charts/usda-commodity-heatmap/scripts/fetch_data.py

      - name: Build — usda-commodity-heatmap
        run: python charts/usda-commodity-heatmap/scripts/build_dashboard.py

      - name: Stage — usda-commodity-heatmap
        run: |
          mkdir -p docs/usda-commodity-heatmap
          cp charts/usda-commodity-heatmap/docs/index.html docs/usda-commodity-heatmap/index.html

      # ─────────────────────────────────────────────────────────────
      # climate-map  (static site; NOAA CPC OND seasonal outlook)
      # ─────────────────────────────────────────────────────────────
      - name: Stage — climate-map
        run: |
          mkdir -p docs/climate-map
          cp charts/climate-map/index.html charts/climate-map/app.js \
             charts/climate-map/data.js charts/climate-map/styles.css \
             docs/climate-map/
          cp -r charts/climate-map/data docs/climate-map/data

      # ─────────────────────────────────────────────────────────────
      # christmas-tree-map  (static; USDA 2022 Census, baked data)
      # ─────────────────────────────────────────────────────────────
      - name: Stage — christmas-tree-map
        run: |
          mkdir -p docs/christmas-tree-map
          cp charts/christmas-tree-map/index.html charts/christmas-tree-map/app.js \
             charts/christmas-tree-map/styles.css \
             docs/christmas-tree-map/
          cp -r charts/christmas-tree-map/data docs/christmas-tree-map/data

      # ─────────────────────────────────────────────────────────────
      # usda-truck-availability  (USDA AMS Socrata — public data)
      # ─────────────────────────────────────────────────────────────
      - name: Install deps — usda-truck-availability
        run: pip install -r charts/usda-truck-availability/requirements.txt

      - name: Build — usda-truck-availability
        # Fetches + renders in one step. DATA_SOURCE=api is the script default;
        # set explicitly so the intent is visible here.
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          DATA_SOURCE: api
        run: python charts/usda-truck-availability/scripts/build_chart.py

      - name: Stage — usda-truck-availability
        run: |
          mkdir -p docs/usda-truck-availability
          cp charts/usda-truck-availability/docs/index.html docs/usda-truck-availability/index.html

      # ─────────────────────────────────────────────────────────────
      # reefer-rates  (static; DAT RateView figures entered by hand)
      # ─────────────────────────────────────────────────────────────
      - name: Stage — reefer-rates
        run: |
          mkdir -p docs/reefer-rates
          cp charts/reefer-rates/index.html docs/reefer-rates/index.html

      # ─────────────────────────────────────────────────────────────
      # reefer-load-to-truck-ratio  (static; DAT Trendlines, by hand)
      # ─────────────────────────────────────────────────────────────
      - name: Stage — reefer-load-to-truck-ratio
        run: |
          mkdir -p docs/reefer-load-to-truck-ratio
          cp charts/reefer-load-to-truck-ratio/index.html docs/reefer-load-to-truck-ratio/index.html

      # ─────────────────────────────────────────────────────────────
      # Landing page
      # ─────────────────────────────────────────────────────────────
      - name: Stage landing page
        run: |
          mkdir -p docs
          cp site/index.html docs/index.html

      # ─────────────────────────────────────────────────────────────
      # Commit refreshed source data (cached in-repo)
      # ─────────────────────────────────────────────────────────────
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/*/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh chart data from source [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
